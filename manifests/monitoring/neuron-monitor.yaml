# Neuron Monitor exporter (Prometheus format, :8000) on every Inferentia/Trainium node.
# Based on the AWS Neuron SDK reference manifest (src/k8/k8s-neuron-monitor-daemonset.yml, image 1.3.0).
# Deviations: dedicated namespace, toleration for the Auto Mode `neuron` NodePool taint.
# NOTE: the container is privileged (it reads /dev/neuron*); it only runs on the inf2/trn nodes selected below.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: neuron-monitor
  namespace: neuron-monitor
  labels:
    app: neuron-monitor
spec:
  selector:
    matchLabels:
      app: neuron-monitor
  template:
    metadata:
      labels:
        app: neuron-monitor
    spec:
      tolerations:
        - operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values: ["linux"]
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values:
                      - trn1.2xlarge
                      - trn1.32xlarge
                      - trn1n.32xlarge
                      - inf1.xlarge
                      - inf1.2xlarge
                      - inf1.6xlarge
                      - inf2.xlarge
                      - inf2.8xlarge
                      - inf2.24xlarge
                      - inf2.48xlarge
      containers:
        - name: neuron-monitor
          image: public.ecr.aws/neuron/neuron-monitor:1.3.0
          ports:
            - containerPort: 8000
          command: ["/opt/bin/entrypoint.sh"]
          args: ["--port", "8000", "--neuron-monitor-config", "/opt/aws/neuron/bin/neuron-monitor.conf"]
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 256m
              memory: 128Mi
          env:
            - name: GOMEMLIMIT
              value: 160MiB
          securityContext:
            privileged: true
