# ADOT collector: scrapes vLLM (:8000/metrics) and neuron-monitor (:8000) pods and remote-writes to Amazon Managed
# Prometheus with SigV4. AWS credentials come from EKS Pod Identity (role attached to SA adot/adot-collector).
# Placeholders __AMP_REMOTE_WRITE__ and __REGION__ are filled in by Terraform.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adot-collector
  namespace: adot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adot-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adot-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adot-collector
subjects:
  - kind: ServiceAccount
    name: adot-collector
    namespace: adot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: adot-collector-config
  namespace: adot
data:
  config.yaml: |
    extensions:
      sigv4auth:
        region: __REGION__
        service: aps
    receivers:
      prometheus:
        config:
          global:
            scrape_interval: 15s
          scrape_configs:
            - job_name: vllm
              metrics_path: /metrics
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [vllm]
              relabel_configs:
                # vLLM pods do not always declare containerPort, so use the fixed port 8000
                - source_labels: [__meta_kubernetes_pod_ip]
                  target_label: __address__
                  replacement: $${1}:8000
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_label_app]
                  target_label: app
            - job_name: neuron-monitor
              metrics_path: /
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [neuron-monitor]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_app]
                  regex: neuron-monitor
                  action: keep
                - source_labels: [__meta_kubernetes_pod_ip]
                  target_label: __address__
                  replacement: $${1}:8000
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
    processors:
      batch:
        timeout: 10s
    exporters:
      prometheusremotewrite:
        endpoint: __AMP_REMOTE_WRITE__
        auth:
          authenticator: sigv4auth
        resource_to_telemetry_conversion:
          enabled: false
    service:
      extensions: [sigv4auth]
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [batch]
          exporters: [prometheusremotewrite]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adot-collector
  namespace: adot
  labels:
    app: adot-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adot-collector
  template:
    metadata:
      labels:
        app: adot-collector
    spec:
      serviceAccountName: adot-collector
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: adot-collector
          image: public.ecr.aws/aws-observability/aws-otel-collector:v0.49.0
          args: ["--config=/etc/adot/config.yaml"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/adot
      volumes:
        - name: config
          configMap:
            name: adot-collector-config
